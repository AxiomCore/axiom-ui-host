name: release-ui-host

on:
  workflow_dispatch:
    inputs:
      version:
        description: Axiom UI Host version (without v)
        required: true
        type: string
      publish:
        description: Publish the GitHub release after checks
        required: true
        default: false
        type: boolean
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  ios-simulator:
    runs-on: macos-14
    env:
      AXIOM_UI_HOST_ENGINE_SOURCE: ${{ github.workspace }}/engine
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check out pinned renderer source
        run: |
          commit=$(python3 -c 'import json; print(json.load(open("toolchain/engine-source.lock.json"))["engine"]["commit"])')
          git clone https://github.com/lynx-family/lynx.git engine
          git -C engine checkout --detach "$commit"
          test "$(git -C engine rev-parse HEAD)" = "$commit"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim
      - name: Install host build prerequisites
        run: brew install cocoapods just
      - name: Validate host source
        run: just check
      - name: Build iOS simulator host
        run: just ios-simulator
      - name: Package and verify release
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          version="${VERSION#v}"
          just package "$version"
          just verify dist/host-manifest.json
      - name: Upload candidate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: axiom-ui-host
          path: dist/
      # Publishing requires a CI-managed detached signing key. Configure the
      # repository secret and enable this step only after signature verification
      # is enforced by the CLI installer.
