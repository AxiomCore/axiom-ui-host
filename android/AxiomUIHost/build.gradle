// Axiom's development host.  This is deliberately a small application that
// consumes the pinned renderer libraries already defined by the staged engine.
apply plugin: 'com.android.application'

android {
    compileSdkVersion rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId 'dev.axiomcore.uihost'
        minSdkVersion 24
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName '0.4.0'
        ndk { abiFilters(*rootProject.ext.abiList) }
        // Lynx publishes several mutually exclusive implementations of its
        // `lynx` flavor dimension. `noasan` is the normal, unsanitized
        // renderer variant and is the one shared by every transitive Lynx
        // module (including LynxJSSDK). Axiom's development transport is in
        // this host, so it does not depend on Lynx's separate `dev` flavor.
        // Keeping the host flavorless preserves assembleRelease.
        missingDimensionStrategy 'lynx', 'noasan'
    }

    signingConfigs {
        release {
            def store = project.findProperty('AXIOM_UI_HOST_ANDROID_KEYSTORE_FILE')
            if (store != null) {
                storeFile file(store)
                storePassword project.property('AXIOM_UI_HOST_ANDROID_KEYSTORE_PASSWORD')
                keyAlias project.property('AXIOM_UI_HOST_ANDROID_KEY_ALIAS')
                keyPassword project.property('AXIOM_UI_HOST_ANDROID_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        // This is an Axiom *development* host, not an end-user application.
        // It must be debuggable so the CLI can use adb run-as to transfer an
        // opaque bundle into app-private storage.  It is still signed with the
        // release key; production application distribution is Phase 6.
        release {
            debuggable true
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    lintOptions { checkReleaseBuilds false }
    packagingOptions {
        pickFirst 'lib/*/libc++_shared.so'
        pickFirst 'lib/*/liblynx.so'
        pickFirst 'lib/*/liblynxtrace.so'
    }
    sourceSets { main { jniLibs.srcDirs = ['src/main/jniLibs'] } }
    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            // Match every native module in the pinned Lynx Gradle graph.
            // Without this, AGP 4.1 silently defaults this module to 3.10.2.
            version CMAKE_VERSION
        }
    }
}

dependencies {
    // Lynx's annotation dependency is compileOnly, but its generated registry
    // imports @Keep directly, so the application must provide it to javac.
    implementation 'androidx.annotation:annotation:1.0.0'
    implementation project(':LynxAndroid')
    implementation project(':LynxBase')
    // Axiom lowers Input to Lynx's native <input>. LynxAndroid does not
    // register XElement behaviors by itself; the host must link and install
    // them or rendering aborts with "No BehaviorController ... input".
    implementation project(':LynxXElement:Input')
    implementation project(':lynx_service_log')
    implementation project(':lynx_service_image')
    implementation project(':lynx_service_http')
}
